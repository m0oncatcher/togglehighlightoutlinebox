plugins {
    id "fabric-loom" version "1.14.10"
}

group = "mod.azure.togglehighlightoutlinebox"
version = "1.21.11"

repositories {
    mavenCentral()
    maven {
        name = "FabricMC"
        url = uri("https://maven.fabricmc.net/")
    }
    maven {
        name = "Terraformers"
        url = uri("https://maven.terraformersmc.com/")
    }
    maven {
        url = uri("https://maven.nucleoid.xyz")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.139.4+1.21.11"

    // Mod Menu (Minecraft 1.21.11 compatible version)
    modApi "com.terraformersmc:modmenu:17.0.0-beta.1"
    modImplementation "eu.pb4:placeholder-api:2.8.1+1.21.10"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
